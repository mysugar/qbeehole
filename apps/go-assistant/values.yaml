replicaCount: 1

image:
  repository: sugardocker/go-assistant
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 8081

ingress:
  enabled: true
  className: "nginx"
  host: assistant.want.trade

env:
  KATAGO_SERVER_URL: "http://katago-service:8082"
  NO_PROXY: "localhost,127.0.0.1"
  DB_HOST: "gitea-db.infrastructure.svc.cluster.local"
  DB_PORT: "3306"
  DB_USER: "gitea"
  DB_PASSWORD: "gitea_password"
  DB_NAME: "gitea" # 建议后续创建一个名为 go_assistant 的库

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi
