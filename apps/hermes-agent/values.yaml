replicaCount: 1

image:
  agent:
    repository: nousresearch/hermes-agent
    tag: latest
    pullPolicy: IfNotPresent
  webui:
    # Upstream hermes-k8s uses hermes-webui-prebuilt:local. Use a registry image
    # in GitOps so every k3s node can pull it without manual image import.
    repository: ghcr.io/nesquena/hermes-webui
    tag: "0.50.236"
    pullPolicy: IfNotPresent
  chrome:
    repository: browserless/chrome
    tag: latest
    pullPolicy: IfNotPresent

persistence:
  enabled: true
  storageClassName: ""
  nfs:
    server: 192.168.50.180
    homePath: /Public/hermes/home
    workspacePath: /Public/hermes/workspace
  home:
    size: 5Gi
  agentSrc:
    size: 5Gi
    storageClassName: ""
  workspace:
    size: 20Gi

service:
  type: ClusterIP
  agent:
    port: 8642
  dashboard:
    port: 9119
  webui:
    port: 8787
  chrome:
    port: 9222
  ssh:
    type: NodePort
    port: 2222
    nodePort: 32222

ingress:
  enabled: true
  className: nginx
  annotations: {}
  webui:
    host: hermes.want.trade
    auth:
      enabled: true
      username: hermes
      password: "HermesWebUI@2026"
  dashboard:
    enabled: true
    host: hermes-dashboard.want.trade
  agent:
    enabled: false
    host: hermes-agent.want.trade

env:
  uid: "10000"
  gid: "10000"
  allowAllUsers: "true"
  chromeCdpUrl: "http://127.0.0.1:9222"
  webuiDefaultWorkspace: /workspace
  apiServerEnabled: "true"
  apiServerHost: "127.0.0.1"
  apiServerPort: "8642"
  apiServerModelName: "Hermes Agent"
  apiServerKey: "HermesApiKey@2026"

proxy:
  httpProxy: "http://192.168.50.207:7897"
  httpsProxy: "http://192.168.50.207:7897"
  noProxy: "127.0.0.1,localhost,192.168.50.181,192.168.50.51,192.168.50.143,192.168.50.144,10.0.0.0/8,192.168.0.0/16,10.42.0.0/16,10.43.0.0/16,*.local"
  allProxy: ""

ssh:
  enabled: true
  user: hermes
  publicKeys:
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAU8hl/JYHPmB4VVlkB4h1xOOYznTJbLvKTYv2ALzvJ3 zhenzhiw@2025.2.11"

resources:
  init:
    requests:
      cpu: 75m
      memory: 384Mi
    limits:
      cpu: 600m
      memory: 768Mi
  agent:
    requests:
      cpu: 300m
      memory: 1536Mi
    limits:
      cpu: 2250m
      memory: 3Gi
  chrome:
    requests:
      cpu: 300m
      memory: 1536Mi
    limits:
      cpu: 3
      memory: 4608Mi
  dashboard:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 900m
      memory: 1152Mi
  webui:
    requests:
      cpu: 300m
      memory: 1536Mi
    limits:
      cpu: 1500m
      memory: 2304Mi
