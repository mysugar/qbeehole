replicaCount: 1

image:
  agent:
    repository: nousresearch/hermes-agent
    tag: latest
    pullPolicy: IfNotPresent
  webui:
    # Upstream hermes-k8s uses hermes-webui-prebuilt:local. Use a registry image
    # in GitOps so every k3s node can pull it without manual image import.
    repository: ghcr.io/nesquena/hermes-webui
    tag: "0.50.236"
    pullPolicy: IfNotPresent
  chrome:
    repository: browserless/chrome
    tag: latest
    pullPolicy: IfNotPresent

persistence:
  enabled: true
  storageClassName: ""
  nfs:
    server: 192.168.50.180
    homePath: /Public/hermes/home
    workspacePath: /Public/hermes/workspace
  home:
    size: 5Gi
  agentSrc:
    size: 5Gi
    storageClassName: ""
  workspace:
    size: 20Gi

service:
  type: ClusterIP
  agent:
    port: 8642
  dashboard:
    port: 9119
  webui:
    port: 8787
  chrome:
    port: 9222

ingress:
  enabled: true
  className: nginx
  annotations: {}
  webui:
    host: hermes.want.trade
  dashboard:
    enabled: true
    host: hermes-dashboard.want.trade
  agent:
    enabled: false
    host: hermes-agent.want.trade

env:
  uid: "10000"
  gid: "10000"
  allowAllUsers: "true"
  chromeCdpUrl: "http://127.0.0.1:9222"
  webuiDefaultWorkspace: /workspace

resources:
  init:
    requests:
      cpu: 75m
      memory: 384Mi
    limits:
      cpu: 600m
      memory: 768Mi
  agent:
    requests:
      cpu: 300m
      memory: 1536Mi
    limits:
      cpu: 2250m
      memory: 3Gi
  chrome:
    requests:
      cpu: 300m
      memory: 1536Mi
    limits:
      cpu: 3
      memory: 4608Mi
  dashboard:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 900m
      memory: 1152Mi
  webui:
    requests:
      cpu: 300m
      memory: 1536Mi
    limits:
      cpu: 1500m
      memory: 2304Mi
