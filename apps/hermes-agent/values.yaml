replicaCount: 1

image:
  agent:
    repository: nousresearch/hermes-agent
    tag: latest
    pullPolicy: IfNotPresent
  webui:
    # Upstream hermes-k8s uses hermes-webui-prebuilt:local. Use a registry image
    # in GitOps so every k3s node can pull it without manual image import.
    repository: ghcr.io/nesquena/hermes-webui
    tag: "0.50.236"
    pullPolicy: IfNotPresent
  chrome:
    repository: browserless/chrome
    tag: latest
    pullPolicy: IfNotPresent

persistence:
  enabled: true
  storageClassName: ""
  nfs:
    server: 192.168.50.180
    homePath: /Public/hermes/home
    agentSrcPath: /Public/hermes/agent-src
    workspacePath: /Public/hermes/workspace
  home:
    size: 5Gi
  agentSrc:
    size: 5Gi
  workspace:
    size: 20Gi

service:
  type: ClusterIP
  agent:
    port: 8642
  dashboard:
    port: 9119
  webui:
    port: 8787
  chrome:
    port: 9222

ingress:
  enabled: true
  className: nginx
  annotations: {}
  webui:
    host: hermes.want.trade
  dashboard:
    enabled: true
    host: hermes-dashboard.want.trade
  agent:
    enabled: false
    host: hermes-agent.want.trade

env:
  uid: "10000"
  gid: "10000"
  allowAllUsers: "true"
  chromeCdpUrl: "http://127.0.0.1:9222"
  webuiDefaultWorkspace: /workspace

dashboardAuth:
  username: admin
  passwordHash: scrypt$16384$8$1$ggV8Ym6EMQRkyzoeZaD1qA==$yhf930bCrZ/HN2J3FdgHWQQt2XoFJ5TYpD5RoJfpfV0=

resources:
  init:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  agent:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 1Gi
  chrome:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1536Mi
  dashboard:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi
  webui:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 768Mi
