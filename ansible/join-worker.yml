---
- name: Get Join Token and Version from Master
  hosts: k3s_nodes
  become: true
  tasks:
    - name: Read node-token from master
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_b64
      tags: ["always"]

    - name: Store token as fact
      set_fact:
        k3s_token: "{{ node_token_b64.content | b64decode | trim }}"
      tags: ["always"]

- name: Join Worker Node to Cluster
  hosts: k3s_workers
  become: true
  vars:
    master_ip: "{{ hostvars[groups['k3s_nodes'][0]]['ansible_host'] }}"
    k3s_token: "{{ hostvars[groups['k3s_nodes'][0]]['k3s_token'] }}"
    k3s_url: "https://{{ master_ip }}:6443"
    k3s_agent_args: "--node-ip={{ ansible_host }} --node-external-ip={{ ansible_host }}"

  tasks:
    - name: Switch to domestic APT mirror
      replace:
        path: /etc/apt/sources.list
        regexp: '(us\.)?(archive|security)\.ubuntu\.com|us\.mirrors\.tuna\.edu\.cn'
        replace: "{{ apt_mirror }}"
      when: ansible_os_family == "Debian"
      tags: ["apt-mirror", "prep"]

    - name: Disable swap (k3s requirement)
      shell: |
        swapoff -a
        sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab
      when: ansible_swaptotal_mb > 0
      ignore_errors: true
      tags: ["prep", "system"]

    - name: Install NFS utilities
      apt:
        name: nfs-common
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"
      tags: ["nfs", "deps"]

    - name: Ensure /etc/rancher/k3s directory exists
      file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'
      tags: ["config"]

    - name: Configure k3s-agent environment file
      template:
        src: k3s.service.env.j2
        dest: /etc/systemd/system/k3s-agent.service.env
        mode: '0600'
      register: service_env_config
      tags: ["config"]

    - name: Configure k3s container registries
      template:
        src: registries.yaml.j2
        dest: /etc/rancher/k3s/registries.yaml
        mode: '0644'
      register: registry_config
      tags: ["registry", "config"]

    - name: Download k3s installer
      get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: '0755'
      tags: ["k3s", "install"]

    - name: Install k3s agent and join cluster
      shell: "INSTALL_K3S_VERSION={{ k3s_version }} K3S_URL={{ k3s_url }} K3S_TOKEN={{ k3s_token }} /tmp/k3s-install.sh agent {{ k3s_agent_args }}"
      args:
        creates: /etc/systemd/system/k3s-agent.service
      tags: ["k3s", "install"]

    - name: Restart k3s-agent if config changed
      systemd:
        name: k3s-agent
        state: restarted
        daemon_reload: true
      when: service_env_config.changed or registry_config.changed
      tags: ["config", "service"]

